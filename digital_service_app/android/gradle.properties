#
# IMPORTANT (low-RAM machines):
# Release builds can crash the Gradle/JVM process with native OOM (Gradle daemon disappears).
# Keep the JVM heap SMALL to leave room for native memory on 4GB devices.
#
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot

# Some Windows setups can exhaust/reserve the small UDP port range Gradle uses for
# file-lock contention notifications, causing: "FileLockContentionHandler" /
# "java.net.BindException: Address already in use: bind".
# Disabling the lock listener keeps builds working at the cost of slightly less
# friendly contention behavior.
systemProp.org.gradle.cache.internal.locklistener.enabled=false
